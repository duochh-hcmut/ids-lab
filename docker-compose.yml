#version: '3.8'

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # 1. Target Endpoint (Victim Web Server)
  target:
    image: nginx:alpine
    container_name: lab_target
    networks:
      lab_net:
        ipv4_address: 172.20.0.20
    ports:
      - "8080:80"   # Web server port
      - "3000:3000" # Mapped web UI port for Wireshark GUI

  # 2. Attacker Node (Kali Linux)
  attacker:
    image: kalilinux/kali-rolling
    container_name: lab_attacker
    tty: true
    stdin_open: true
    networks:
      lab_net:
        ipv4_address: 172.20.0.10
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["sleep", "infinity"]

  # 3. Suricata IDS Sensor Node (Shares target network stack)
  ids_sensor:
    image: jasonish/suricata:latest
    container_name: lab_ids
    network_mode: "service:target"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/config/suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata/rules/local.rules:/var/lib/suricata/rules/local.rules
      - ./suricata/logs:/var/log/suricata
    command: -i eth0 -c /etc/suricata/suricata.yaml -S /var/lib/suricata/rules/local.rules

  # 4. PCAP Recorder (Shares target network stack)
  pcap_recorder:
    image: alpine:latest
    container_name: lab_pcap
    network_mode: "service:target"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata/logs:/pcap
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache tcpdump && sleep infinity"]

  # 5. Web-based Wireshark GUI Node (Shares target network stack)
  wireshark:
    image: lscr.io/linuxserver/wireshark:latest
    container_name: lab_wireshark
    network_mode: "service:target"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./suricata/logs:/config/pcap